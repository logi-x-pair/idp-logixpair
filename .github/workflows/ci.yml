name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Version matches packages/db/docker-compose.yml.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # CI-only dummy values; nothing here is a real secret. The web test
      # runner (apps/web/scripts/run-tests.ts) refuses to start unless the
      # TEST_* URLs point at the dedicated disposable *_test database.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/krazil_idp_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/krazil_idp_test
      BETTER_AUTH_SECRET: ci-only-dummy-better-auth-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      IDP_ADMIN_EMAIL: admin@example.com
      IDP_ADMIN_PASSWORD: ci-only-admin-password-1234
      OAUTH_ADMIN_EMAILS: admin@example.com
      # hybrid + a status secret so the revocation-status suite is NOT skipped.
      OAUTH_ACCESS_TOKEN_MODE: hybrid
      OAUTH_REVOCATION_CHECK_SECRET: ci-only-dummy-revocation-secret-0123456789ab
      TWO_FACTOR_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint and format (non-mutating)
        run: bunx biome ci .
      - name: Type check
        run: bun run check-types
      - name: Contract package tests
        working-directory: packages/types
        run: bun test
      - name: Web integration tests (isolated test database)
        working-directory: apps/web
        run: bun run test
      - name: Build
        # Runs after the web tests so the schema-pushed test database exists.
        run: bun run build

  # Playwright E2E needs seeded OAuth clients and a full three-server stack;
  # it stays a documented local/pre-release step (see README and
  # apps/test-rp/playwright.config.ts), not a per-push gate.
