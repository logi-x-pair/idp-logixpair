name: krazil-idp

services:
  postgres:
    image: postgres:18
    container_name: krazil-idp-postgres
    environment:
      POSTGRES_DB: krazil-idp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - krazil-idp_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  krazil-idp_postgres_data:
